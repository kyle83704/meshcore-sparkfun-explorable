[platformio]
default_envs = SparkFun_expLoRaBLE_companion_usb

[env:SparkFun_expLoRaBLE_companion_usb]
platform = https://github.com/nigelb/platform-apollo3blue.git#a4872991c2746c7e1d775cc2bfc5bdf3da0beb89
platform_packages =
  framework-arduinoapollo3 @ https://github.com/sparkfun/Arduino_Apollo3.git#771ce8fe14b54425775bb48c777709bf28eb9100
board = SparkFun_Thing_Plus_expLoRaBLE
board_build.variants_dir = .pio/apollo3_framework_variant
framework = arduino
extra_scripts = pre:scripts/apollo3_compat.py
upload_protocol = svl
board_upload.maximum_size = 843776
monitor_speed = 115200
build_flags =
  -w
  -DNDEBUG
  -DRADIOLIB_STATIC_ONLY=1
  -DRADIOLIB_GODMODE=1
  -D APOLLO3_PLATFORM
  -D LORA_FREQ=915.0
  -D LORA_BW=250
  -D LORA_SF=10
  -D LORA_CR=5
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=20
  -D P_LORA_NSS=36
  -D P_LORA_DIO_1=40
  -D P_LORA_RESET=44
  -D P_LORA_BUSY=39
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
  -I variants/sparkfun_explorable
  -I examples/companion_radio
  -I .pio/libdeps/SparkFun_expLoRaBLE_companion_usb
  -I $PROJECT_PACKAGES_DIR/framework-arduinoapollo3/libraries/SPI/src
build_src_filter =
  -<*>
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/sparkfun_explorable/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  SPI
  Wire
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ 0.4.0
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/RTClib @ 2.1.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ 1.4.0
  bblanchon/ArduinoJson @ 7.4.3
